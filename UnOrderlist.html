<!DOCTYPE html>
<html>
    <head>
        <title>UNORDER LIST HTML</title>
        <style>
            ul{
                list-style-type: circle;
            }
        </style>
    </head>
    <body>
        <h2>Menu makanan</h2>
        <!--style type ul : disc, circle, square-->
        <ul>
            <li>Makanan</li>
            <li>Minuman</li>
            <li>Nasi Goreng</li>
            <li>Ayam Goreng</li>
            <li>Bakmie goreng</li>
            <li>bebek goreng</li>
            <li>Teh manis</li>
        </ul>
    </body>
</html>
