        <h2>Colspan dan Rowspan pada Table</h2>
        <!-- colpsan : menggabungkan kolom
         rowspan : menggabung baris-->
         <table>
            <tr>
                <th rowspan="2">No</th>
                <th rowspan="2">Nama</th>
                <th colspan="2">Nilai</th>
            </tr>
            <tr>
                <td>Ulangan 1</td>
                <td>Ulangan 2</td>
            </tr>
            <tr>
                <td>1</td>

            </tr>
            <tr>
                <td>3</td>
                <td>Nene</td>
                <td>97</td>
                <td>96</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Emu</td>
                <td>93</td>
                <td>91</td>
            </tr>
            <tr>
                <td>5</td>

                <td>100</td>
            </tr>
         </table>
