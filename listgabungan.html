<!DOCTYPE html>
<html>
    <head>
        <title>Orderlisy LIST HTML</title>
        <style>
            ul{
                list-style-type: circle;
            }
            ol.a{
                list-style: lower-alpha;
            }
            ol{
                background-color: cadetblue;
            }
           
        </style>
    </head>
    <body>
        <h2>Menu makanan</h2>
        <p>makanan</p>
        <!--style type ul : disc, circle, square-->
        <ol>
            <li>Mcd</li>
            <ul>
                <li>kentang goreng</li>
            </ul>
            <li>kfc</li>
            <li>Nasi Goreng</li>
            <li>Ayam Goreng</li>
           
        </ol>
        <p>minuman</p>
        <ul>
            <li>sprite</li>
            <li>air</li>
        </ul>
        
        <h2>ICON PADA HTML</h2>
        <i class="fa-solid fa-house"></i>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"></svg>
    </body>
</html>
